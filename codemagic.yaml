workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Fix flutter_sms & Bypass AAR Check
        script: |
          python3 -c '
          import glob, os, re

          # 1. Patch flutter_sms namespace & old Kotlin version
          paths = glob.glob(os.path.expanduser("~/.pub-cache/hosted/pub.dev/flutter_sms-*/android/build.gradle"))
          for p in paths:
              with open(p, "r") as f:
                  content = f.read()
              if "namespace" not in content:
                  content = content.replace("android {", "android {\n    namespace \"com.babariviere.flutter_sms\"")
              if "1.3.50" in content:
                  content = content.replace("1.3.50", "1.9.0")
              with open(p, "w") as f:
                  f.write(content)

          # 2. Patch main app namespace
          app_manifest = "android/app/src/main/AndroidManifest.xml"
          app_gradle = "android/app/build.gradle"
          if os.path.exists(app_manifest) and os.path.exists(app_gradle):
              with open(app_manifest, "r") as f:
                  m_content = f.read()
              match = re.search(r"package=\"([^\"]+)\"", m_content)
              if match:
                  pkg_name = match.group(1)
                  with open(app_gradle, "r") as f:
                      g_content = f.read()
                  if "namespace" not in g_content:
                      g_content = g_content.replace("android {", f"android {{\n    namespace \"{pkg_name}\"")
                      with open(app_gradle, "w") as f:
                          f.write(g_content)

          # 3. Disable checkReleaseAarMetadata to bypass AGP version mismatch
          root_gradle = "android/build.gradle"
          if os.path.exists(root_gradle):
              with open(root_gradle, "r") as f:
                  r_content = f.read()
              fix_snippet = """
          subprojects {
              afterEvaluate { project ->
                  project.tasks.all { task ->
                      if (task.name.contains("checkReleaseAarMetadata") || task.name.contains("checkAarMetadata")) {
                          task.enabled = false
                      }
                  }
              }
          }
          """
              if "checkAarMetadata" not in r_content:
                  with open(root_gradle, "a") as f:
                      f.write(fix_snippet)
                  print("AAR metadata check disabled successfully.")
          '
      - name: Build Android APK
        script: flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
