workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m1
    scripts:
      - name: Get dependencies
        script: flutter pub get
      - name: Fix flutter_sms Manifest & Compatibility
        script: |
          python3 -c '
          import glob, os, re

          # 1. Patch flutter_sms plugin (namespace, Kotlin, and remove legacy package from manifest)
          paths = glob.glob(os.path.expanduser("~/.pub-cache/hosted/pub.dev/flutter_sms-*/android/build.gradle"))
          for p in paths:
              with open(p, "r") as f:
                  content = f.read()
              if "namespace" not in content:
                  content = content.replace("android {", "android {\n    namespace \"com.babariviere.flutter_sms\"")
              if "1.3.50" in content:
                  content = content.replace("1.3.50", "1.9.0")
              with open(p, "w") as f:
                  f.write(content)

          manifest_paths = glob.glob(os.path.expanduser("~/.pub-cache/hosted/pub.dev/flutter_sms-*/android/src/main/AndroidManifest.xml"))
          for mp in manifest_paths:
              with open(mp, "r") as f:
                  m_content = f.read()
              # Rimuove l attributo package obsoleto che causa il fallimento
              m_content = re.sub(r"package=\"[^\"]+\"", "", m_content)
              with open(mp, "w") as f:
                  f.write(m_content)
              print(f"Rimosso attributo package da: {mp}")

          # 2. Patch main app namespace in build.gradle.kts
          app_gradle_kts = "android/app/build.gradle.kts"
          app_manifest = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(app_manifest) and os.path.exists(app_gradle_kts):
              with open(app_manifest, "r") as f:
                  m_content = f.read()
              match = re.search(r"package=\"([^\"]+)\"", m_content)
              if match:
                  pkg_name = match.group(1)
                  with open(app_gradle_kts, "r") as f:
                      g_content = f.read()
                  if "namespace" not in g_content:
                      g_content = g_content.replace("android {", f"android {{\n    namespace = \"{pkg_name}\"")
                      with open(app_gradle_kts, "w") as f:
                          f.write(g_content)

          # 3. Force compatible older androidx versions to bypass AGP version check
          if os.path.exists(app_gradle_kts):
              with open(app_gradle_kts, "r") as f:
                  g_content = f.read()
              override_snippet = """
          configurations.all {
              resolutionStrategy {
                  force("androidx.core:core:1.12.0")
                  force("androidx.core:core-ktx:1.12.0")
                  force("androidx.browser:browser:1.7.0")
              }
          }
          """
              if "androidx.core:core:1.12.0" not in g_content:
                  with open(app_gradle_kts, "a") as f:
                      f.write(override_snippet)
          '
      - name: Build Android APK
        script: flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
